# ==============================================================================
# Configuração de Rate Limiting para Proteção de Autenticação Web no Nginx
# Local comum de inclusão: /etc/nginx/conf.d/rate-limit.conf ou dentro de nginx.conf
# ==============================================================================

# Criação de zona de memória 'login_limit' de 10 Megabytes (~160.000 IPs)
# Define a taxa máxima para 1 requisição por segundo (1r/s) por endereço IP
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=1r/s;

# Retorna status HTTP 429 (Too Many Requests) em vez de 503 quando excedido o limite
limit_req_status 429;

server {
    listen 80;
    server_name exemplo-lab.local;

    # Proteção focada no endpoint de autenticação
    location /login.php {
        # Permite rajada de até 3 requisições consecutivas sem atraso (nodelay)
        # Qualquer requisição além do burst é imediatamente rejeitada com 429
        limit_req zone=login_limit burst=3 nodelay;

        # Configurações normais de proxy/FastCGI
        # try_files $uri =404;
        # fastcgi_pass unix:/var/run/php/php-fpm.sock;
        # fastcgi_index index.php;
        # include fastcgi_params;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
